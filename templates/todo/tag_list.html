{% extends "base.html" %}

{% block content %}
<h2>Tags</h2>
<a href="{% url 'todo:tag-create' %}"><button>Add Tag</button></a>
<br><br>

<table border="1" cellpadding="5" cellspacing="0">
    <tr>
        <th>Tag Name</th>
        <th>Actions</th>
    </tr>
    {% for tag in tag_list %}
    <tr>
        <td>{{ tag.name }}</td>
        <td>
            <a href="{% url 'todo:tag-update' tag.pk %}">Update</a> |
            <a href="{% url 'todo:tag-delete' tag.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="2">No tags yet.</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
